name: Apply UI enhancements

on:
  push:
    branches: [main]
    paths:
      - 'tools/add_navigation_and_frames.py'
      - '.github/workflows/apply-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update pages
        run: python tools/add_navigation_and_frames.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html teil2.html teil3.html
          git commit -m "Add back-to-top navigation and heading frames"
          git push
