name: Fix start overview

on:
  push:
    branches: [main]
    paths:
      - 'tools/fix_start_overview.py'
      - '.github/workflows/fix-start-overview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update start page
        run: python tools/fix_start_overview.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct chapter overview on start page"
          git push
